[project]
name = "harness"
version = "0.1.0"
description = "An agent harness built step by step with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs network or a live model; excluded by default"]

[tool.ruff.format]
exclude = ["docs/**", ".analysis/**"]
